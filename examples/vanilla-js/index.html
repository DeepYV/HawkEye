<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HawkEye - Vanilla JS Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
        }
        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>HawkEye observer SDK</h1>

    <div class="info">
        <h3>Status: <span id="status">Initializing...</span></h3>
        <p>Dead clicks, errors, and the signup flow are reported. The DOM is not recorded.</p>
    </div>

    <button type="button" id="custom-event" data-hawkeye="demo-clicked">Track demo click</button>

    <h3>Signup</h3>
    <form id="demo-form" data-hawkeye="signup">
        <button type="submit" data-hawkeye="signup-submit">Create account</button>
    </form>

    <div data-hawkeye-ignore>
        <button type="button">Carousel next</button>
    </div>

    <script type="module">
        import { init, track, formOutcome, flow } from '../../sdk/dist/index.js';

        init({
            apiKey: 'dev-api-key',
            ingestionUrl: 'http://localhost:11224',
            appVersion: '1.4.0',
            environment: 'development',
            events: ['signup_submitted', 'demo_clicked'],
            importantFlows: [{ name: 'signup', steps: ['account'], important: true }],
        });

        document.getElementById('status').textContent = 'Active';

        const signup = flow('signup');

        document.getElementById('custom-event').addEventListener('click', () => {
            track('demo_clicked', { source: 'vanilla' });
        });

        document.getElementById('demo-form').addEventListener('submit', (event) => {
            event.preventDefault();
            signup.start();
            formOutcome({ formKey: 'signup', result: 'success' });
            track('signup_submitted', { plan: 'free' });
            signup.complete();
        });
    </script>
</body>
</html>
